# The workshop stack: the agent you instrument, and everything it sends
# telemetry to. Module 1 starts it, from this directory, with one command:
#
#   docker compose up -d       start it (or apply a change to llm.env)
#   ./doctor.sh                wait for it, and check every part
#   docker compose down -v     stop it and delete the data
#
# Everything is a stock image from Docker Hub: nothing is built, and you don't
# need Python on your laptop. The agent runs in the `agent` container, which
# mounts ../exercises, the files of every module, at /workshop:
#
#   docker compose exec agent python 04-the-chat-agent/chat.py
#
# Inside this file, containers reach each other by service name. Your browser
# reaches them on localhost. Ports are published on localhost only: Grafana has
# no login here, so it must not be reachable from the rest of the network.

name: genai-workshop

services:
  # --- The agent: where your code runs ---------------------------------------
  #
  # Your files are mounted, not copied, so a saved edit is live on the next
  # command. Dependencies install into a Docker volume when the container
  # starts, never into your files. Changed llm.env? Run `docker compose up -d`.
  agent:
    image: python:3.12-slim
    init: true # so that it stops at once
    working_dir: /workshop
    env_file: [./llm.env]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PYTHONUSERBASE: /deps
      PATH: /deps/bin:/usr/local/bin:/usr/bin:/bin
      PYTHONDONTWRITEBYTECODE: "1" # no root-owned __pycache__ in your files
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ../exercises:/workshop
      - ./requirements.txt:/requirements.txt:ro
      - agent-deps:/deps
    # Lets the agent reach a model running on your laptop, such as Ollama.
    extra_hosts: ["host.docker.internal:host-gateway"]
    command:
      - sh
      - -c
      - >-
        pip install --user -q --no-warn-script-location --root-user-action=ignore -r /requirements.txt
        && touch /tmp/ready
        && exec sleep infinity
    depends_on: [otel-collector, fake-llm]
    restart: unless-stopped

  # A scripted stand-in for a model, for when no real one is available.
  # llm.env says how to switch to it.
  fake-llm:
    image: python:3.12-slim
    command: ["python", "-u", "/app/server.py"]
    volumes: ["./fake-llm:/app:ro"]
    restart: unless-stopped

  # --- Telemetry --------------------------------------------------------------

  # The single place the application sends telemetry to.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4318:4318" # OTLP over HTTP
    volumes: ["./collector:/etc/otelcol-contrib:ro"]
    depends_on: [victoriametrics, victorialogs, victoriatraces]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=1
      - -search.latencyOffset=1s # show fresh points, not ones 30 seconds old
      - -opentelemetry.usePrometheusNaming # gen_ai.x -> gen_ai_x
    ports: ["127.0.0.1:8428:8428"]
    volumes: ["victoria-metrics:/storage"]
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    command: ["-storageDataPath=/storage", "-retentionPeriod=7d"]
    ports: ["127.0.0.1:9428:9428"]
    volumes: ["victoria-logs:/storage"]
    restart: unless-stopped

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.11.0
    command: ["-storageDataPath=/storage", "-retentionPeriod=3d"]
    ports: ["127.0.0.1:10428:10428"]
    volumes: ["victoria-traces:/storage"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: victoriametrics-metrics-datasource,victoriametrics-logs-datasource
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [victoriametrics, victorialogs, victoriatraces]
    restart: unless-stopped

# Where the data lives: Docker volumes, outside your files.
# `docker compose down` keeps them, and `docker compose down -v` deletes them.
volumes:
  agent-deps:
  victoria-metrics:
  victoria-logs:
  victoria-traces:
  grafana:
