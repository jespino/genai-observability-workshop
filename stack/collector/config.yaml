# Receives OTLP from the application and sends each signal to its own store.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  otlphttp/metrics:
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
  otlphttp/logs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    headers:
      VL-Stream-Fields: service.name
  otlphttp/traces:
    traces_endpoint: http://victoriatraces:10428/insert/opentelemetry/v1/traces

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
